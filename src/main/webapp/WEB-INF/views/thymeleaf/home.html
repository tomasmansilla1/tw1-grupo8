<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Inicio - Trivia Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/main.css}">

</head>


<body class="home-body">


<!-- NAVBAR -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- CONTENIDO PRINCIPAL -->

<main class="container my-5">


    <div class="row g-4 justify-content-center">


        <!-- =========================
             PANEL PRINCIPAL
        ========================== -->

        <div class="col-lg-7">

            <div class="quiz-card text-center h-100">


                <h1 class="title">

                    Bienvenido

                    <span th:if="${session.usuario != null}"
                          th:text="${session.usuario.username}">

                    </span>

                </h1>


                <div class="divider"></div>


                <p class="subtitle">

                    Elegí una opción para continuar

                </p>


                <div class="d-grid gap-3 mt-4">


                    <a th:href="@{/buscar-juego}"
                       class="btn-quiz">

                        Jugar

                    </a>


                    <a th:href="@{/tutorial}"
                       class="btn-quiz">

                        Cómo jugar

                    </a>


                    <a th:href="@{/como-jugar}"
                       class="btn-quiz">

                        Simulador

                    </a>


                    <a th:href="@{/usuario/historial}"
                       class="btn-quiz">

                        Historial

                    </a>


                    <a th:href="@{/ranking}"
                       class="btn-quiz">

                        Ranking completo

                    </a>


                    <a th:href="@{/estadisticas}"
                       class="btn-quiz">

                        Estadísticas

                    </a>


                    <a th:if="${session.usuario != null
                             and session.usuario.rol == 'ADMIN'}"

                       th:href="@{/admin}"

                       class="btn-quiz">

                        Panel Admin

                    </a>


                </div>


            </div>

        </div>



        <!-- =========================
             USUARIOS REGISTRADOS
        ========================== -->

        <div class="col-lg-5">

            <div class="quiz-card h-100">


                <h3 class="title text-center">

                    Usuarios registrados

                </h3>


                <div class="divider"></div>


                <!-- SI NO HAY USUARIOS -->

                <div th:if="${usuarios == null or #lists.isEmpty(usuarios)}"

                     class="text-center text-muted">

                    No hay usuarios registrados.

                </div>


                <!-- SI HAY USUARIOS -->

                <div th:if="${usuarios != null and !#lists.isEmpty(usuarios)}"

                     class="usuarios-lista">


                    <div th:each="usuario : ${usuarios}"

                         class="usuario-item">


                        <div class="usuario-info">


                            <strong th:text="${usuario.username}">

                                Usuario

                            </strong>


                            <small th:text="${usuario.rol}">

                                ROL

                            </small>


                        </div>


                    </div>


                </div>


            </div>

        </div>


    </div>


</main>



<!-- FOOTER -->

<footer class="quiz-footer mt-4">

    <div class="container small">

        &copy; 2026 -

        Taller Web I -

        Universidad Nacional de La Matanza

    </div>

</footer>


</body>

</html>
