<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

</head>

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark">

    <div class="navbar-container">

        <!-- LOGO -->

        <a class="navbar-brand"
           th:href="@{/home}">

            🎮 Preguntados

        </a>


        <!-- BOTÓN MOBILE -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- LINKS -->

        <div class="collapse navbar-collapse"
             id="navbarContent">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/home}">

                        Inicio

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/buscar-juego}">

                        Jugar

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/tutorial}">

                        ¿Cómo jugar?

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/ranking}">

                        Ranking

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/usuario/historial}">

                        Historial

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/estadisticas}">

                        Estadísticas

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/perfil}">

                        👤 Perfil

                    </a>

                </li>


                <!-- ADMIN -->

                <li class="nav-item"
                    th:if="${session.usuario != null
                    and session.usuario.rol == 'ADMIN'}">

                    <a class="nav-link admin-link"
                       th:href="@{/admin}">

                        Panel Admin

                    </a>

                </li>


                <!-- USUARIO -->

                <li class="nav-item user-name"
                    th:if="${session.usuario != null}">

                    👋

                    <span th:text="${session.usuario.username}">
                    </span>

                </li>


                <!-- LOGIN -->

                <li class="nav-item"
                    th:if="${session.usuario == null}">

                    <a class="nav-link"
                       th:href="@{/login}">

                        Iniciar sesión

                    </a>

                </li>


                <!-- LOGOUT -->

                <li class="nav-item"
                    th:if="${session.usuario != null}">

                    <a class="nav-link logout-link"
                       th:href="@{/logout}">

                        Salir

                    </a>

                </li>


            </ul>

        </div>

    </div>


    <style>


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background:

                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            padding: 0;

            box-shadow:

                0 4px 12px
                rgba(0, 0, 0, .15);

            width: 100%;
        }


        .navbar-container {

            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding: 15px 30px;

            display: flex;

            align-items: center;
        }


        /* =========================
           LOGO
        ========================= */

        .navbar-brand {

            color: white !important;

            font-size: 1.4rem;

            font-weight: bold;

            text-decoration: none;

            white-space: nowrap;
        }


        .navbar-brand:hover {

            transform: scale(1.04);

            transition: .3s;
        }


        /* =========================
           LISTA
        ========================= */

        .navbar-nav {

            display: flex;

            align-items: center;

            gap: 8px;

            list-style: none;

            padding: 0;

            margin: 0;
        }


        .nav-item {

            list-style: none;
        }


        .nav-link {

            color: white !important;

            font-weight: bold;

            padding: 10px 14px !important;

            border-radius: 20px;

            transition: all .3s ease;

            white-space: nowrap;
        }


        .nav-link:hover {

            background: rgba(255, 255, 255, .2);

            transform: translateY(-2px);
        }


        /* =========================
           ADMIN
        ========================= */

        .admin-link {

            color: #FFF1B8 !important;

        }


        /* =========================
           USUARIO
        ========================= */

        .user-name {

            color: white;

            font-weight: bold;

            padding: 10px;
        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-link {

            color: #FFE3EA !important;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 991px) {

            .navbar-container {

                padding: 12px 20px;
            }


            .navbar-nav {

                align-items: flex-start;

                padding-top: 15px;

                gap: 5px;
            }


            .nav-link {

                width: 100%;
            }

        }


    </style>

</nav>

</body>

</html>
