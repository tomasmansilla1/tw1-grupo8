<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark shadow-sm"
     style="background: linear-gradient(135deg, #2B7DBF, #1f5f94);">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand fw-bold"
           th:href="@{/home}">

            🎮 Trivia Game

        </a>


        <!-- BOTÓN RESPONSIVE -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Abrir menú">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- CONTENIDO NAVBAR -->
        <div class="collapse navbar-collapse"
             id="navbarContent">


            <ul class="navbar-nav ms-auto">


                <!-- INICIO -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/home}">

                        Inicio

                    </a>

                </li>


                <!-- JUGAR -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/buscar-juego}">

                        Jugar

                    </a>

                </li>


                <!-- TUTORIAL -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/tutorial}">

                        ¿Cómo jugar?

                    </a>

                </li>


                <!-- RANKING -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/ranking}">

                        Ranking

                    </a>

                </li>


                <!-- HISTORIAL -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/usuario/historial}">

                        Historial

                    </a>

                </li>


                <!-- ESTADÍSTICAS -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/estadisticas}">

                        Estadísticas

                    </a>

                </li>


                <!-- PERFIL -->
                <li class="nav-item"
                    th:if="${session.usuario != null}">

                    <a class="nav-link"
                       th:href="@{/perfil}">

                        👤 Perfil

                    </a>

                </li>


                <!-- PANEL ADMIN -->
                <li class="nav-item"
                    th:if="${session.usuario != null
                    and session.usuario.rol == 'ADMIN'}">

                    <a class="nav-link text-warning fw-bold"
                       th:href="@{/admin}">

                        Panel Admin

                    </a>

                </li>


                <!-- USUARIO LOGUEADO -->
                <li class="nav-item"
                    th:if="${session.usuario != null}">

                    <span class="nav-link text-light">

                        👋
                        <span th:text="${session.usuario.username}">
                            Usuario
                        </span>

                    </span>

                </li>


                <!-- CERRAR SESIÓN -->
                <li class="nav-item"
                    th:if="${session.usuario != null}">

                    <a class="nav-link text-danger fw-bold"
                       th:href="@{/logout}">

                        Salir

                    </a>

                </li>


                <!-- INICIAR SESIÓN -->
                <li class="nav-item"
                    th:if="${session.usuario == null}">

                    <a class="nav-link"
                       th:href="@{/login}">

                        Iniciar sesión

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
