<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resultado</title>
<style>

    /* =========================
       RESET
    ========================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================= */

    body {
        font-family: 'Arial', sans-serif;

        background:
            linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

        min-height: 100vh;
    }


    /* =========================
       CONTENEDOR DEL RESULTADO
       NO AFECTA AL NAVBAR
    ========================= */

    .resultado-page {

        min-height: calc(100vh - 100px);

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 60px 20px;
    }


    /* =========================
       TARJETA PRINCIPAL
    ========================= */

    .resultado-card {

        background: white;

        padding: 55px 45px;

        border-radius: 30px;

        box-shadow:
            0 20px 60px rgba(0, 0, 0, .30);

        max-width: 600px;

        width: 100%;

        text-align: center;

        animation: aparecer .7s ease;
    }


    /* =========================
       ANIMACIÓN
    ========================= */

    @keyframes aparecer {

        from {
            opacity: 0;
            transform: translateY(30px) scale(.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    /* =========================
       EMOJI
    ========================= */

    .resultado-emoji {

        font-size: 4.5rem;

        margin-bottom: 20px;

        animation: saltar 1.5s ease infinite;
    }


    @keyframes saltar {

        0% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }

        100% {
            transform: translateY(0);
        }
    }


    /* =========================
       TÍTULO
    ========================= */

    .resultado-titulo {

        color: #333;

        font-size: 2.5rem;

        font-weight: bold;

        margin-bottom: 25px;
    }


    /* =========================
       ESTADÍSTICAS
    ========================= */

    .resultado-estadisticas {

        background: #f5f5f5;

        padding: 25px;

        border-radius: 15px;

        margin-bottom: 30px;
    }


    .resultado-stat {

        margin-bottom: 20px;

        color: #333;
    }


    .resultado-stat:last-child {

        margin-bottom: 0;
    }


    .resultado-label {

        color: #666;

        font-size: .95rem;

        margin-bottom: 8px;
    }


    .resultado-valor {

        font-size: 2.2rem;

        color: #667eea;

        font-weight: bold;
    }


    .resultado-porcentaje {

        color: #764ba2;
    }


    /* =========================
       BOTÓN
    ========================= */

    .resultado-btn {

        display: inline-block;

        padding: 15px 40px;

        border: none;

        border-radius: 8px;

        background:
            linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

        color: white;

        text-decoration: none;

        font-size: 1.1em;

        font-weight: bold;

        cursor: pointer;

        transition: all .3s ease;
    }


    .resultado-btn:hover {

        color: white;

        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(102, 126, 234, .4);
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

        .resultado-page {

            padding: 40px 15px;
        }


        .resultado-card {

            padding: 40px 25px;
        }


        .resultado-titulo {

            font-size: 2rem;
        }


        .resultado-emoji {

            font-size: 3.5rem;
        }


        .resultado-valor {

            font-size: 1.8rem;
        }


        .resultado-btn {

            width: 100%;
        }
    }

</style>

</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}">
    </div>


    <main class="resultado-contenedor">

        <div class="resultado-final">

            <div class="emoji"
                 th:if="${porcentaje >= 80}">

                🎉

            </div>


            <div class="emoji"
                 th:if="${porcentaje >= 60 and porcentaje < 80}">

                👍

            </div>


            <div class="emoji"
                 th:if="${porcentaje < 60}">

                📚

            </div>


            <h1>

                ¡Juego Finalizado!

            </h1>


            <div class="estadisticas">

                <div class="stat">

                    <div class="stat-label">

                        Tu Puntaje

                    </div>


                    <div class="stat-valor"

                         th:text="${puntajeFinal}
                         + ' de '
                         + ${totalPreguntas}">

                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">

                        Porcentaje

                    </div>


                    <div class="stat-valor porcentaje"

                         th:text="${porcentaje} + '%'">

                    </div>

                </div>

            </div>


            <a th:href="@{/categoria}"

               class="btn-jugar">

                Jugar de Nuevo 🎮

            </a>

        </div>

    </main>

</body>

</html>
