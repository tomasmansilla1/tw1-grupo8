A<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
 <style>

    /* =========================
       RESET
    ========================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================= */

    body {
        font-family: Arial, Helvetica, sans-serif;

        background:
            linear-gradient(
                135deg,
                #2B7DBF 0%,
                #764BA2 45%,
                #7B61FF 100%
            );

        min-height: 100vh;

        display: flex;
        flex-direction: column;
    }


    /* =========================
       CONTENIDO PRINCIPAL
    ========================= */

    .main-content {
        flex: 1;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 60px 20px;
    }


    /* =========================
       TARJETA DEL RESULTADO
    ========================= */

    .resultado-card {

        background: rgba(255, 255, 255, 0.96);

        width: 100%;
        max-width: 650px;

        padding: 55px 45px;

        border-radius: 30px;

        text-align: center;

        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.25),
            0 0 25px rgba(123, 97, 255, 0.25);

        animation: aparecer 0.7s ease;
    }


    /* =========================
       ANIMACIÓN
    ========================= */

    @keyframes aparecer {

        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }


    /* =========================
       EMOJI
    ========================= */

    .emoji {

        font-size: 4.5rem;

        margin-bottom: 20px;

        animation: saltar 1.5s ease infinite;
    }


    @keyframes saltar {

        0% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }

        100% {
            transform: translateY(0);
        }

    }


    /* =========================
       TÍTULO
    ========================= */

    .resultado-card h1 {

        font-size: 3rem;

        font-weight: 800;

        margin-bottom: 25px;

        background:
            linear-gradient(
                135deg,
                #4DA3D9,
                #7B61FF
            );

        background-clip: text;
        -webkit-background-clip: text;

        -webkit-text-fill-color: transparent;
    }


    /* =========================
       CATEGORÍA
    ========================= */

    .categoria-badge {

        display: inline-block;

        padding: 13px 28px;

        border-radius: 30px;

        background:
            linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

        color: white;

        font-size: 1.05rem;

        font-weight: bold;

        margin-bottom: 25px;

        box-shadow:
            0 8px 20px rgba(102, 126, 234, 0.3);
    }


    /* =========================
       PUNTAJE
    ========================= */

    .puntaje {

        font-size: 1.8rem;

        font-weight: bold;

        color: #6c5cc5;

        margin: 20px 0 30px;
    }


    /* =========================
       RESPUESTA CORRECTA
    ========================= */

    .respuesta-correcta {

        background: #f1f3f5;

        border-left: 5px solid #764BA2;

        border-radius: 12px;

        padding: 18px;

        margin: 25px 0;

        color: #444;
    }


    .respuesta-correcta p:first-child {

        margin-bottom: 8px;

        font-size: 1rem;

        color: #666;
    }


    .respuesta-correcta p:last-child {

        font-size: 1.15rem;

        font-weight: bold;

        color: #5e4aa8;
    }


    /* =========================
       BOTONES
    ========================= */

    .botones {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 15px;

        margin-top: 30px;

        flex-wrap: wrap;
    }


    .botones form {

        margin: 0;
    }


    .botones button {

        border: none;

        padding: 16px 30px;

        min-width: 220px;

        border-radius: 30px;

        background:
            linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

        color: white;

        font-size: 1rem;

        font-weight: bold;

        cursor: pointer;

        transition: all 0.3s ease;

        box-shadow:
            0 8px 18px rgba(102, 126, 234, 0.25);
    }


    .botones button:hover {

        transform: translateY(-3px);

        box-shadow:
            0 12px 25px rgba(102, 126, 234, 0.4);
    }


    /* =========================
       BOTÓN VOLVER
    ========================= */

    .botones .btn-volver {

        background: linear-gradient(
            135deg,
            #adb5bd,
            #6c757d
        );
    }


    .botones .btn-volver:hover {

        background: linear-gradient(
            135deg,
            #6c757d,
            #495057
        );
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 768px) {

        .main-content {

            padding: 40px 15px;
        }


        .resultado-card {

            padding: 45px 25px;

            border-radius: 25px;
        }


        .resultado-card h1 {

            font-size: 2.3rem;
        }


        .emoji {

            font-size: 3.8rem;
        }


        .botones {

            flex-direction: column;
        }


        .botones form {

            width: 100%;
        }


        .botones button {

            width: 100%;

            min-width: unset;
        }

    }


    @media (max-width: 480px) {

        .resultado-card {

            padding: 35px 20px;
        }


        .resultado-card h1 {

            font-size: 2rem;
        }


        .puntaje {

            font-size: 1.5rem;
        }


        .categoria-badge {

            font-size: 0.95rem;

            padding: 11px 20px;
        }

    }

</style>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">

        <div class="resultado-card">

            <div class="emoji"
                 th:if="${acierto}">
                🎉
            </div>

            <div class="emoji"
                 th:unless="${acierto}">
                ❌
            </div>

            <h1 th:if="${acierto}">
                ¡CORRECTO!
            </h1>

            <h1 th:unless="${acierto}">
                INCORRECTO
            </h1>

            <div class="categoria-badge"
                th:text="${session.categoriaActual}">
            </div>

            <div class="puntaje"
                 th:text="'Puntaje: ' + ${puntaje}">
            </div>

            <div th:if="${!acierto}"
                 class="respuesta-correcta">

                <p>
                    Respuesta correcta:
                </p>

                <p th:text="${respuestaCorrecta}">
                </p>

            </div>

            <div class="botones">

                <th:block th:if="${!esUltimaPregunta}">

                    <form th:action="@{/categoria/siguiente}"
                          method="post">

                        <button type="submit">
                            SIGUIENTE PREGUNTA →
                        </button>

                    </form>

                </th:block>


                <th:block th:if="${esUltimaPregunta}">

                    <form th:action="@{/categoria/siguiente-categoria}"
                          method="post">

                        <button type="submit">
                            SIGUIENTE CATEGORÍA →
                        </button>

                    </form>


                    <form th:action="@{/categoria}"
                          method="get">

                        <button type="submit"
                                class="btn-volver">

                            VOLVER

                        </button>

                    </form>

                </th:block>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
