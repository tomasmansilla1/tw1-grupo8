<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Completado!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        .emoji {
            font-size: 5em;
            margin-bottom: 30px;
            animation: bounce 0.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .puntaje {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            margin: 30px 0;
        }

        a {
            display: inline-block;
            padding: 15px 50px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 30px;
            font-size: 1.1em;
        }

        a:hover {
            background: #764ba2;
        }

        .resultado{
            margin: 50px auto;
        }
    </style>
</head>


<body>


    <!-- NAVBAR -->

    <div th:replace="~{fragments/navbar :: navbar}">
    </div>


    <!-- RESULTADO -->

    <main class="resultado-container">


        <div class="resultado-card">


            <!-- RESPUESTA CORRECTA -->

            <div th:if="${acierto}">


                <div class="resultado-icon">

                    ✅

                </div>


                <h1 class="resultado-titulo correcto">

                    ¡Correcto!

                </h1>


                <div class="divider">
                </div>


                <p class="subtitle">

                    ¡Muy bien! Sumaste puntos a tu partida.

                </p>


            </div>


            <!-- RESPUESTA INCORRECTA -->

            <div th:if="${!acierto}">


                <div class="resultado-icon">

                    ❌

                </div>


                <h1 class="resultado-titulo incorrecto">

                    Incorrecto

                </h1>


                <div class="divider">
                </div>


                <div class="respuesta-correcta">


                    La respuesta correcta era:


                    <strong th:text="${respuestaCorrecta}">

                    </strong>


                </div>


            </div>


            <!-- PUNTAJE -->

            <div class="puntaje-box">


                <div class="puntaje-label">

                    Puntaje actual

                </div>


                <div class="puntaje"
                     th:text="${puntajeFinal}">

                </div>


            </div>


            <!-- BOTÓN -->

            <a th:href="@{/categoria}"
               class="btn-resultado">


                JUGAR DE NUEVO 🎮


            </a>


        </div>


    </main>


    <!-- FOOTER -->

    <div th:replace="~{fragments/footer :: footer}">
    </div>


</body>

</html>
